<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Mnemosyne</title>
  <desc id="desc">A dark gradient banner for the Mnemosyne project page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="55%" stop-color="#111c36"/>
      <stop offset="100%" stop-color="#1f3b7b"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c5cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#glow)"/>
  <g fill="none" stroke="#7ce2ff" stroke-opacity="0.16" stroke-width="2">
    <path d="M120 280 C260 120, 410 120, 560 230 S860 340, 1020 180 S1300 70, 1460 190"/>
    <path d="M160 300 C320 170, 450 160, 610 250 S900 370, 1080 210 S1320 120, 1500 220"/>
  </g>
  <g transform="translate(110 92)">
    <text x="0" y="0" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700">Mnemosyne</text>
    <text x="0" y="72" fill="#b8c8ef" font-family="Segoe UI, Arial, sans-serif" font-size="26">Bionic memory for AI agents</text>
    <text x="0" y="118" fill="#9db0dd" font-family="Segoe UI, Arial, sans-serif" font-size="24">Knowledge graph · Predictive memory · Dream consolidation · Skill evolution · MCP</text>
  </g>
  <g transform="translate(1120 72)">
    <rect x="0" y="0" width="320" height="280" rx="24" fill="#0b1324" fill-opacity="0.72" stroke="#6e86c7" stroke-opacity="0.35"/>
    <circle cx="85" cy="92" r="38" fill="#7c5cff" fill-opacity="0.8"/>
    <circle cx="180" cy="78" r="22" fill="#44d7ff" fill-opacity="0.8"/>
    <circle cx="220" cy="156" r="28" fill="#ffd166" fill-opacity="0.85"/>
    <path d="M85 92 L180 78 L220 156 L85 92" stroke="#dce7ff" stroke-opacity="0.55" stroke-width="2" fill="none"/>
    <text x="34" y="214" fill="#eef4ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">graph + recall + dream</text>
    <text x="34" y="244" fill="#b5c4e7" font-family="Segoe UI, Arial, sans-serif" font-size="16">Built for AI that should remember</text>
  </g>
</svg>
