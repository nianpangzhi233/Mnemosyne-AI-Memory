name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile key scripts
        run: |
          python -m py_compile scripts/skill_daemon.py scripts/dashboard/pages/dashboard.py scripts/graph_dream.py scripts/graph_query.py scripts/graph_write.py scripts/graph_audit.py

      - name: Check required project files
        run: |
          test -f README.md
          test -f docs/README_CN.md
          test -f assets/hero.svg
          test -f site/index.html
